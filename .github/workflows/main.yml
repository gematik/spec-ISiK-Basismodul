# This is a basic workflow to help you get started with Actions

name: Build and Publish IG

# Controls when the action will run.
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  actions: write
  contents: write
  packages: read

jobs:

  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gefyra/ig-publisher-with-snapshot-support:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: Download dependencies via FHIR Package Tool using sushi-config.yaml
      - name: Download Dependencies
        run: |
          fhir-pkg-tool --sushi-deps-file sushi-config.yaml -o ./packages

      # Run SUSHI (FSH -> FHIR conversion)
      - name: Run SUSHI
        run: |
          sushi .

      # Run the HL7 FHIR IG Publisher
      - name: Build IG
        run: |
          igpublisher -ig ig.ini -tx https://tx.fhir.org

      # Upload the IG build output as an artifact
      - name: Upload Build Results
        uses: actions/upload-artifact@v4
        with:
          name: fhir-ig
          path: output/

      # Deploy the IG to GitHub Pages on main branch
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
