# This is a basic workflow to help you get started with Actions

name: Build and Publish IG

# Controls when the action will run.
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  actions: write
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: Download dependencies via FHIR Package Tool using sushi-config.yaml
      - name: Download Dependencies
        uses: Gefyra/ig-publisher-action@main
        with:
          variant: with-snapshot-support
          command: fhir-pkg-tool
          args: --sushi-deps-file sushi-config.yaml -o ./packages

      # Run SUSHI (FSH -> FHIR conversion)
      - name: Run SUSHI
        uses: Gefyra/ig-publisher-action@main
        with:
          variant: with-snapshot-support
          command: sushi
          args: .

      # Run the HL7 FHIR IG Publisher
      - name: Build IG
        uses: Gefyra/ig-publisher-action@main
        with:
          variant: with-snapshot-support
          command: igpublisher
          args: -ig ig.ini -tx https://tx.fhir.org

      # Upload the IG build output as an artifact
      - name: Upload Build Results
        uses: actions/upload-artifact@v4
        with:
          name: fhir-ig
          path: output/

      # Deploy the IG to GitHub Pages on main branch
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
