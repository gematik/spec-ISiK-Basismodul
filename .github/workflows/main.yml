# This is a basic workflow to help you get started with Actions

name: CI (FHIR Validation)

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    paths:
      - 'Resources/**'
      - '.github/workflows/**'
    branches-ignore:
      - 'main**'
  pull_request:
    branches:
      - 'main**'
  workflow_call:
    secrets:
      SIMPLIFIER_USERNAME:
        required: true
      SIMPLIFIER_PASSWORD:
        required: true
      WORKFLOW_PERMISSION_GITHUB:
        required: true

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  actions: write
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  # Validate all resources using Firely Terminal
  CI_FHIR_VALIDATION:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout code (PR)
        uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Checkout code (Main)
        uses: actions/checkout@v6
        if: github.event_name != 'pull_request'

      - name: Firely.Terminal (GitHub Actions)
        uses: FirelyTeam/firely-terminal-pipeline@v0.8.14
        with:
          PATH_TO_CONFORMANCE_RESOURCES: Resources/fsh-generated/resources/
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: true
          JAVA_VALIDATION_OPTIONS: >
            -allow-example-urls true
            -output validation.json
            -html-output validation.html
            -show-message-ids
            -language de
            -jurisdiction de
            -display-issues-are-warnings
            -advisor-file validator/advisor.json
            -resolution-context file:Resources/fsh-generated/resources/
            -sct 11000274103/version/20251115
          SIMPLIFIER_USERNAME: ${{ secrets.SIMPLIFIER_USERNAME }}
          SIMPLIFIER_PASSWORD: ${{ secrets.SIMPLIFIER_PASSWORD }}
          SUSHI_ENABLED: true
          TERMINOLOGY_SERVICE_BFARM_ENABLED: true
          CLOSE_SLICING_FOR_VALIDATION: true
          SUSHI_OPTIONS: Resources/
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_JAVA VALIDATION_CONFORMANCE_DOTNET

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fhir-validation-results
          path: |
            validation.json
            validation.html
          retention-days: 1

      - name: Convert Validation Report
        uses: patrick-werner/validation-outcome-markdown-renderer@v1
        with:
          bundle-file: validation.json
          include: errors
          filters: |
            # Struktur: fileName|messageId|detailsWildcard|location
            # examples contain sdc extensions which creates an error as this extension is not defined in ISiK
            Patient-IsikPatientTemplate.json|Validation_VAL_Profile_NotSlice||Patient.gender.extension[0]
            Patient-IsikPatientTemplate.json|Validation_VAL_Profile_NotSlice||Patient.birthDate.extension[0]
            Questionnaire-DemoTemplatebasedExtractionQuestionnaire.json|Validation_VAL_Profile_NotSlice||Questionnaire.contained[0]/*Patient/IsikPatientTemplate*/.gender.extension[0]
            Questionnaire-DemoTemplatebasedExtractionQuestionnaire.json|Validation_VAL_Profile_NotSlice||Questionnaire.contained[0]/*Patient/IsikPatientTemplate*/.birthDate.extension[0]
            # LL codes aren't tied to a LOINC on Questionnaire, it isn't included in the current release, will be included in the future.
            # Zulip thread: https://chat.fhir.org/#narrow/channel/179202-terminology/topic/LOINC.3A.20Unknown.20code.20in.20the.20Codesystem/near/577684036
            ValueSet-mii-vs-icu-score-rass.json|VALUESET_INCLUDE_INVALID_CONCEPT_CODE|*Unknown code 'LA33959-0'*|ValueSet.compose.include[0].concept[1]
            ValueSet-mii-vs-icu-score-rass.json|VALUESET_INCLUDE_INVALID_CONCEPT_CODE|*Unknown code 'LA33960-8'*|ValueSet.compose.include[0].concept[2]
            ValueSet-mii-vs-icu-score-rass.json|VALUESET_INCLUDE_INVALID_CONCEPT_CODE|*Unknown code 'LA33962-4'*|ValueSet.compose.include[0].concept[4]
            ValueSet-mii-vs-icu-score-rass.json|VALUESET_INCLUDE_INVALID_CONCEPT_CODE|*Unknown code 'LA33963-2'*|ValueSet.compose.include[0].concept[5]
            ValueSet-mii-vs-icu-score-rass.json|VALUESET_INCLUDE_INVALID_CONCEPT_CODE|*Unknown code 'LA33964-0'*|ValueSet.compose.include[0].concept[6]
            ValueSet-mii-vs-icu-score-rass.json|VALUESET_INCLUDE_INVALID_CONCEPT_CODE|*Unknown code 'LA33965-7'*|ValueSet.compose.include[0].concept[7]
            ValueSet-mii-vs-icu-score-rass.json|VALUESET_INCLUDE_INVALID_CONCEPT_CODE|*Unknown code 'LA33966-5'*|ValueSet.compose.include[0].concept[8]
            ValueSet-mii-vs-icu-score-rass.json|VALUESET_INCLUDE_INVALID_CONCEPT_CODE|*Unknown code 'LA33967-3'*|ValueSet.compose.include[0].concept[9]
            Observation-ExampleOrganRASS20200311.json|Terminology_TX_NoValid_1_CC|*MII VS ICU Score RASS*|Observation.value.ofType(CodeableConcept)
            # .net fails to create a Snapshot for this extension (probably caused by the fhir version 4.0.0 bug in 1.1.0 of the backport subscription ig), but it is included in the current release, will be fixed with 1.2.0 backport subscription ig release.
            CapabilityStatement-ISiKCapabilityStatementSubscriptionRolle.json|Extension_EXT_Unknown_NotHere|*capabilitystatement-subscriptiontopic-canonical could not be found*|CapabilityStatement.rest[0].resource[0].extension[1]
            # The validation stack picks the r5 CS for expansion which changed finished -> completed. Fix will be included in upcoming basisprofile release through version pinning.
            |Terminology_TX_NoValid_16|*Encounter Status ValueSet*|*

      - name: Validate Resource Status
        uses: patrick-werner/fhir-resource-status-check@1.2.1
        with:
          folder: './Resources/fsh-generated/resources/'
      - name: Add & Commit
        uses: EndBug/add-and-commit@v10
        with:
          committer_name: GitHub Actions Bot
          committer_email: ActionBot@github.com
          add: Resources/fsh-generated/resources/
          message: auto-generated FHIR files by GitHub Actions (CI FSH to FHIR Validation)