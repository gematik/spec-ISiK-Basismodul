name: Check FHIR Quality Control

on:
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
            cd scripts/QualityAssuranceAutomation
            npm ci
        
        

      - name: Run FHIR quality control
        run: |
          node quality-control.js
        working-directory: scripts/QualityAssuranceAutomation

      - name: Upload log file
        uses: actions/upload-artifact@v4
        with:
          name: fhir-quality-control-log
          path: scripts/QualityAssuranceAutomation/log/validation.*.log
