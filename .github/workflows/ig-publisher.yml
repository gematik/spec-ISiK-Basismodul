# This is a basic workflow to help you get started with Actions

name: Build and Publish IG

# Controls when the action will run.
on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:

  # Shared preparation step: Run SUSHI once for all IGs
  prepare:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gefyra/ig-publisher-with-snapshot-support:latest
    env:
      SUSHI_INPUT_DIR: Resources

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Download dependencies via FHIR Package Tool using sushi-config.yaml from Resources
      - name: Download Dependencies
        run: |
          fhir-pkg-tool --sushi-deps-file ${{ env.SUSHI_INPUT_DIR }}/sushi-config.yaml
          echo "=== FHIR Package Cache Contents ==="
          ls -la ~/.fhir/packages/ || echo "Package cache directory not found"
          echo "==================================="

      # Run SUSHI (FSH -> FHIR conversion) on Resources directory
      - name: Run SUSHI
        run: |
          sushi ${{ env.SUSHI_INPUT_DIR }}

      # Upload fsh-generated output for use by build jobs
      - name: Upload FSH Generated Resources
        uses: actions/upload-artifact@v4
        with:
          name: fsh-generated
          path: ${{ env.SUSHI_INPUT_DIR }}/fsh-generated
          retention-days: 1

      # Upload FHIR package cache for use by build jobs
      - name: Upload FHIR Package Cache
        uses: actions/upload-artifact@v4
        with:
          name: fhir-packages
          path: ~/.fhir/packages
          retention-days: 1
          if-no-files-found: warn

  # ============================================
  # Build each IG in parallel
  # ⚙️ IG Configuration: Add or modify IGs in the matrix below
  # ============================================
  build:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    container:
      image: ghcr.io/gefyra/ig-publisher-with-snapshot-support:latest
    strategy:
      matrix:
        include:
          - ig_name: Subscription-IG
            ig_dir: publisher-guides/Subscription-IG
            capability_statement_url: https://gematik.de/fhir/isik/CapabilityStatement/ISiKCapabilityStatementSubscriptionServerAkteur
          # Add more IGs here:
          # - ig_name: Basis-IG
          #   ig_dir: publisher-guides/Basis-IG
          #   capability_statement_url: https://gematik.de/fhir/isik/CapabilityStatement/AnotherCapability

    env:
      SUSHI_INPUT_DIR: Resources
      IG_PUBLISHER_DIR: ${{ matrix.ig_dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Download the fsh-generated artifact from prepare job
      - name: Download FSH Generated Resources
        uses: actions/download-artifact@v4
        with:
          name: fsh-generated
          path: ${{ env.SUSHI_INPUT_DIR }}/fsh-generated

      # Download the FHIR package cache from prepare job
      - name: Download FHIR Package Cache
        uses: actions/download-artifact@v4
        with:
          name: fhir-packages
          path: ~/.fhir/packages

      # Verify package cache
      - name: Verify Package Cache
        run: |
          echo "=== Verifying FHIR Package Cache ==="
          ls -la ~/.fhir/packages/ || echo "Package cache directory empty or not found"
          echo "===================================="

      # Expand CapabilityStatement and copy referenced resources to IG Publisher input directory
      - name: Expand CapabilityStatement
        uses: Gefyra/capabilityStatement-expander@v0
        with:
          input_directory: ${{ env.SUSHI_INPUT_DIR }}/fsh-generated
          output_directory: ${{ env.IG_PUBLISHER_DIR }}/input/resources
          capability_statement_url: ${{ matrix.capability_statement_url }}
      
      # Run the HL7 FHIR IG Publisher
      - name: Build IG
        run: |
          igpublisher -ig ${{ env.IG_PUBLISHER_DIR }}/ig.ini

      # Upload expanded resources for commit (outside container)
      - name: Upload Expanded Resources
        uses: actions/upload-artifact@v4
        with:
          name: expanded-resources-${{ matrix.ig_name }}
          path: ${{ env.IG_PUBLISHER_DIR }}/input/resources
          retention-days: 1

      - name: Record branch metadata for Pages cleanup
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          set -eu
          echo "${GITHUB_REF_NAME}" > "${{ env.IG_PUBLISHER_DIR }}/output/.branch-name"

      # Upload the IG build output as an artifact
      - name: Upload Build Results
        uses: actions/upload-artifact@v4
        with:
          name: fhir-ig-${{ matrix.ig_name }}
          path: |
            ${{ env.IG_PUBLISHER_DIR }}/output

      # Publish the IG output to a branch-specific directory on gh-pages
      - name: Publish branch output to GitHub Pages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: bash
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          IG_NAME: ${{ matrix.ig_name }}
        run: |
          set -euo pipefail

          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"

          rm -rf gh-pages

          if git ls-remote --heads "${remote_url}" gh-pages | grep -q "."; then
            git clone --depth 1 --branch gh-pages "${remote_url}" gh-pages
          else
            git clone "${remote_url}" gh-pages
            cd gh-pages
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            touch .nojekyll
            git add .nojekyll
            git commit -m "chore: initialize gh-pages"
            git push --set-upstream origin gh-pages
            cd ..
          fi

          branch_dir="gh-pages/${GITHUB_REF_NAME}/${IG_NAME}"
          rm -rf "${branch_dir}"
          mkdir -p "${branch_dir}"
          cp -R "${{ env.IG_PUBLISHER_DIR }}/output/." "${branch_dir}/"

          cd gh-pages
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add --all
          if git diff --cached --quiet; then
            echo "No updates to publish."
            exit 0
          fi
          git commit -m "chore: update ${GITHUB_REF_NAME}/${IG_NAME} pages"
          git push origin gh-pages

      - name: Announce published URL
        id: announce_url
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: bash
        run: |
          set -eu
          repo_owner="${GITHUB_REPOSITORY_OWNER}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          branch="${GITHUB_REF_NAME}"
          ig_name="${{ matrix.ig_name }}"
          url="https://${repo_owner}.github.io/${repo_name}/${branch}/${ig_name}/"
          echo "Published ${ig_name} to ${url}"
          printf '### Deployment: %s\n[Open published IG for branch `%s`](%s)\n' "${ig_name}" "${branch}" "${url}" >> "${GITHUB_STEP_SUMMARY}"
          echo "published_url=${url}" >> "${GITHUB_OUTPUT}"
          echo "ig_name=${ig_name}" >> "${GITHUB_OUTPUT}"

      - name: Upsert PR comment with published URL
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          PUBLISHED_URL: ${{ steps.announce_url.outputs.published_url }}
          IG_NAME: ${{ steps.announce_url.outputs.ig_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = process.env.BRANCH_NAME;
            const igName = process.env.IG_NAME;
            const marker = `<!-- ig-publish-url-${igName} -->`;
            const url = process.env.PUBLISHED_URL;
            const body = `${marker}
            ### Deployment: ${igName}
            [Open published IG for branch \`${branch}\`](${url})`;

            // Try to find an open PR for this branch
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 100
            });
            const pr = prs.find(p => p.head && p.head.ref === branch);
            if (!pr) {
              core.info(`No open PR found for branch ${branch}; skipping PR comment.`);
              return;
            }

            // List existing comments on that PR
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number, per_page: 100
            });

            // Find existing marker comment for this specific IG
            const existing = comments.find(c => typeof c.body === 'string' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
              core.info(`Updated IG publish URL comment for ${igName} on PR #${pr.number}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body
              });
              core.info(`Created IG publish URL comment for ${igName} on PR #${pr.number}`);
            }

  # Commit all expanded resources in one go
  commit:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # Download all artifacts
      - name: Download All Expanded Resources
        uses: actions/download-artifact@v4
        with:
          pattern: expanded-resources-*
          path: artifacts

      # Copy all expanded resources to their respective directories
      - name: Copy Expanded Resources
        run: |
          for dir in artifacts/expanded-resources-*/; do
            ig_name=$(basename "$dir" | sed 's/expanded-resources-//')
            echo "Processing $ig_name..."
            
            # Find matching IG directory in publisher-guides
            ig_path=$(find publisher-guides -maxdepth 1 -type d -name "*$ig_name*" -print -quit)
            if [ -n "$ig_path" ]; then
              echo "Copying to $ig_path/input/resources/"
              mkdir -p "$ig_path/input/resources"
              cp -r "$dir"* "$ig_path/input/resources/"
            else
              echo "Warning: No matching directory found for $ig_name"
            fi
          done

      # Commit all changes at once
      - name: Commit All Expanded Resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publisher-guides/*/input/resources
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update expanded CapabilityStatement resources for all IGs [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
