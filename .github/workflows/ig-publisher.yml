name: Build and Publish IG

# IMPORTANT — Matrix build
# The Implementation Guides (IGs) to be built are configured further down
# in the `strategy.matrix.include` section. For each IG, provide these fields:
#   - ig_name:   A unique identifier / display name (e.g. Organspendeerkennung)
#   - ig_dir:    Directory under `publisher-guides` (e.g. publisher-guides/Organspendeerkennung)
#   - capability_statement_urls: A YAML list with one or more CapabilityStatement URLs
#
# Example (add to the matrix below):
#   - ig_name: My-IG
#     ig_dir: publisher-guides/My-IG
#     capability_statement_urls:
#       - https://example.com/CapabilityStatement/Server
#       - https://example.com/CapabilityStatement/Client
#
# Note: The matrix controls which parallel build jobs are created. Edit that
# list to add or remove IGs or to specify multiple CapabilityStatements per IG.

# Controls when the action will run.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no input changes detected'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:

  # Shared preparation step: Run SUSHI once for all IGs
  prepare:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gefyra/ig-publisher-with-snapshot-support:latest
    env:
      SUSHI_INPUT_DIR: Resources

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Download dependencies via FHIR Package Tool using sushi-config.yaml from Resources
      - name: Download Dependencies
        run: |
          fhir-pkg-tool --sushi-deps-file ${{ env.SUSHI_INPUT_DIR }}/sushi-config.yaml
          echo "=== FHIR Package Cache Contents ==="
          ls -la /github/home/.fhir/packages/ | head -20
          echo "==================================="

      # Run SUSHI (FSH -> FHIR conversion) on Resources directory
      - name: Run SUSHI
        run: |
          sushi ${{ env.SUSHI_INPUT_DIR }}

      # Upload fsh-generated output for use by build jobs
      - name: Upload FSH Generated Resources
        uses: actions/upload-artifact@v4
        with:
          name: fsh-generated
          path: ${{ env.SUSHI_INPUT_DIR }}/fsh-generated
          retention-days: 1

      # Upload FHIR package cache for use by build jobs
      - name: Upload FHIR Package Cache
        uses: actions/upload-artifact@v4
        with:
          name: fhir-packages
          path: /github/home/.fhir/packages
          retention-days: 1

  # ============================================
  # Build each IG in parallel
  # ⚙️ IG Configuration: Add or modify IGs in the matrix below
  # ============================================
  build:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    container:
      image: ghcr.io/gefyra/ig-publisher-with-snapshot-support:latest
    strategy:
      matrix:
        include:
          # ig_name: Name of the IG (used for artifact names and publishing)
          # ig_dir: Directory of the IG within publisher-guides
          # capability_statement_urls: List of CapabilityStatement URLs to expand (YAML list)
          #   - For a single URL:
          #       capability_statement_urls:
          #         - https://example.com/CapabilityStatement/Server
          #   - For multiple URLs:
          #       capability_statement_urls:
          #         - https://example.com/CS1
          #         - https://example.com/CS2
          #         - https://example.com/CS3
          - ig_name: Organspendeerkennung
            ig_dir: publisher-guides/Organspendeerkennung
            capability_statement_urls:
              - https://gematik.de/fhir/isik/CapabilityStatement/ISiKCapabilityStatementBasisServerAkteur
          # Add more IGs here:
          # - ig_name: Basis-IG
          #   ig_dir: publisher-guides/Basis-IG
          #   capability_statement_urls:
          #     - https://gematik.de/fhir/isik/CapabilityStatement/Server
          #     - https://gematik.de/fhir/isik/CapabilityStatement/Client

    env:
      SUSHI_INPUT_DIR: Resources
      IG_PUBLISHER_DIR: ${{ matrix.ig_dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Download the FHIR package cache from prepare job
      - name: Download FHIR Package Cache
        uses: actions/download-artifact@v4
        with:
          name: fhir-packages
          path: /github/home/.fhir/packages

      # Copy packages to where IG Publisher expects them
      - name: Setup Package Cache for IG Publisher
        run: |
          echo "=== Copying packages to /root/.fhir/packages ==="
          mkdir -p /root/.fhir/packages
          cp -r /github/home/.fhir/packages/* /root/.fhir/packages/
          echo "=== Package cache ready ==="
          ls -la /root/.fhir/packages/ | head -20
          echo "==============================="

      # Download the fsh-generated artifact from prepare job
      - name: Download FSH Generated Resources
        uses: actions/download-artifact@v4
        with:
          name: fsh-generated
          path: ${{ env.SUSHI_INPUT_DIR }}/fsh-generated

      # generate Implementationguide resource & menu
      - name: Run SUSHI (IG local)
        run: |
          sushi ${{ env.IG_PUBLISHER_DIR }}      

      # Upload SUSHI-generated ImplementationGuide(s) so the commit job can persist them
      - name: Upload SUSHI-generated ImplementationGuide
        uses: actions/upload-artifact@v4
        with:
          name: sushi-generated-ig-${{ matrix.ig_name }}
          # upload the per-IG fsh-generated directory so the commit job can persist SUSHI outputs as-is
          path: ${{ env.IG_PUBLISHER_DIR }}/fsh-generated
          retention-days: 1

      # Expand CapabilityStatement(s) and copy referenced resources to IG Publisher input directory
      # Note: The action will be updated to support multiple URLs via capability_statement_urls parameter
      - name: Expand CapabilityStatement
        uses: Gefyra/capabilityStatement-expander@v0
        with:
          input_directory: ${{ env.SUSHI_INPUT_DIR }}/fsh-generated
          output_directory: ${{ env.IG_PUBLISHER_DIR }}/input/resources
          capability_statement_url: ${{ toJSON(matrix.capability_statement_urls) }}

      # Check if there are changes that warrant rebuilding this IG
      - name: Check for input changes
        id: check_changes
        shell: bash
        run: |
          set -euo pipefail
          
          # Fix git ownership issue in container
          git config --global --add safe.directory /__w/spec-ISiK-Basismodul/spec-ISiK-Basismodul || true
          git config --global --add safe.directory "$(pwd)" || true
          
          # Check if force_build is enabled
          force_build="${{ github.event.inputs.force_build }}"
          if [ "${force_build}" = "true" ]; then
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
            echo "Force build enabled - proceeding with IG build regardless of changes"
            exit 0
          fi
          
          FSH_GEN_PATH="${{ env.IG_PUBLISHER_DIR }}/fsh-generated"
          INPUT_PATH="${{ env.IG_PUBLISHER_DIR }}/input"
          
          echo "Checking for changes in:"
          echo "  - ${FSH_GEN_PATH}"
          echo "  - ${INPUT_PATH}"
          echo ""
          
          has_changes=false
          
          # Check both paths for changes
          for check_path in "${FSH_GEN_PATH}" "${INPUT_PATH}"; do
            if [ -d "$check_path" ]; then
              status_out=$(git status --porcelain "$check_path" 2>/dev/null || echo "")
          
              if [ -n "$status_out" ]; then
                has_changes=true
                echo "Changes detected in ${check_path}:"
                echo "$status_out" | head -20
                echo ""
              fi
            fi
          done
          
          # Set output
          if [ "$has_changes" = true ]; then
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "No changes detected - skipping IG build"
          
            mkdir -p "${GITHUB_WORKSPACE}/.ig-urls-temp"
            echo "${{ matrix.ig_name }}|NO_CHANGES" >> "${GITHUB_WORKSPACE}/.ig-urls-temp/urls.txt"
          fi

      # Run the HL7 FHIR IG Publisher
      - name: Build IG
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          igpublisher -ig ${{ env.IG_PUBLISHER_DIR }}/ig.ini

      # Upload expanded resources for commit (always, not only when build runs)
      - name: Upload Expanded Resources
        uses: actions/upload-artifact@v4
        with:
          name: expanded-resources-${{ matrix.ig_name }}
          path: ${{ env.IG_PUBLISHER_DIR }}/input/resources
          retention-days: 1
          if-no-files-found: warn

      - name: Record branch metadata for Pages cleanup
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && steps.check_changes.outputs.has_changes == 'true'
        run: |
          set -eu
          echo "${GITHUB_REF_NAME}" > "${{ env.IG_PUBLISHER_DIR }}/output/.branch-name"

      # Upload the IG build output as an artifact
      - name: Upload Build Results
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fhir-ig-${{ matrix.ig_name }}
          path: |
            ${{ env.IG_PUBLISHER_DIR }}/output

      # Publish the IG output to a branch-specific directory on gh-pages
      - name: Publish branch output to GitHub Pages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && steps.check_changes.outputs.has_changes == 'true'
        shell: bash
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          IG_NAME: ${{ matrix.ig_name }}
        run: |
          set -euo pipefail

          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"

          rm -rf gh-pages

          if git ls-remote --heads "${remote_url}" gh-pages | grep -q "."; then
            git clone --depth 1 --branch gh-pages "${remote_url}" gh-pages
          else
            git clone "${remote_url}" gh-pages
            cd gh-pages
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            touch .nojekyll
            git add .nojekyll
            git commit -m "chore: initialize gh-pages"
            git push --set-upstream origin gh-pages
            cd ..
          fi

          branch_dir="gh-pages/${GITHUB_REF_NAME}/${IG_NAME}"
          rm -rf "${branch_dir}"
          mkdir -p "${branch_dir}"
          cp -R "${{ env.IG_PUBLISHER_DIR }}/output/." "${branch_dir}/"

          cd gh-pages
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add --all
          if git diff --cached --quiet; then
            echo "No updates to publish."
            exit 0
          fi
          git commit -m "chore: update ${GITHUB_REF_NAME}/${IG_NAME} pages"
          git push origin gh-pages

      - name: Announce published URL
        id: announce_url
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && steps.check_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -eu
          repo_owner="${GITHUB_REPOSITORY_OWNER}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          branch="${GITHUB_REF_NAME}"
          ig_name="${{ matrix.ig_name }}"
          url="https://${repo_owner}.github.io/${repo_name}/${branch}/${ig_name}/"
          echo "Published ${ig_name} to ${url}"
          printf '### Deployment: %s\n[Open published IG for branch `%s`](%s)\n' "${ig_name}" "${branch}" "${url}" >> "${GITHUB_STEP_SUMMARY}"
          
          # Store URL in a file for the commit job to collect
          mkdir -p "${GITHUB_WORKSPACE}/.ig-urls-temp"
          echo "${ig_name}|${url}" >> "${GITHUB_WORKSPACE}/.ig-urls-temp/urls.txt"

      - name: Upload IG URL metadata
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: ig-url-${{ matrix.ig_name }}
          path: ${{ github.workspace }}/.ig-urls-temp/urls.txt
          retention-days: 1
          if-no-files-found: ignore

  # Commit all expanded resources in one go
  commit:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # Download SUSHI-generated ImplementationGuides (only)
      - name: Download SUSHI-generated ImplementationGuides
        uses: actions/download-artifact@v4
        with:
          pattern: sushi-generated-ig-*
          path: artifacts

      # Download expanded resources from build jobs (these are required)
      - name: Download Expanded Resources
        uses: actions/download-artifact@v4
        with:
          pattern: expanded-resources-*
          path: artifacts

      # Copy SUSHI-generated ImplementationGuides and expanded resources to their respective directories
      - name: Copy SUSHI-generated IGs and Expanded Resources
        shell: bash
        run: |
          set -euo pipefail
          # First handle SUSHI-generated IGs
          for dir in artifacts/sushi-generated-ig-*/; do
            [ -d "$dir" ] || continue
            base=$(basename "$dir")
            ig_name=$(echo "$base" | sed 's/sushi-generated-ig-//')
            echo "Processing SUSHI-generated artifact $base for IG: $ig_name"

            # Find matching IG directory in publisher-guides
            ig_path=$(find publisher-guides -maxdepth 1 -type d -name "*$ig_name*" -print -quit)
            if [ -n "$ig_path" ]; then
              target_dir="$ig_path/fsh-generated"
              echo "Copying SUSHI-generated files to ${target_dir}/"
              mkdir -p "${target_dir}"
              # Clean target to avoid stale files
              rm -rf "${target_dir:?}/*" || true
              cp -r "$dir"* "${target_dir}/" || true
            else
              echo "Warning: No matching directory found for $ig_name (SUSHI artifact)"
            fi
          done

          # Then handle expanded resources from capability statement expansion
          for dir in artifacts/expanded-resources-*/; do
            [ -d "$dir" ] || continue
            base=$(basename "$dir")
            ig_name=$(echo "$base" | sed 's/expanded-resources-//')
            echo "Processing expanded-resources artifact $base for IG: $ig_name"

            ig_path=$(find publisher-guides -maxdepth 1 -type d -name "*$ig_name*" -print -quit)
            if [ -n "$ig_path" ]; then
              echo "Copying expanded resources to $ig_path/input/resources/"
              mkdir -p "$ig_path/input/resources"
              cp -r "$dir"* "$ig_path/input/resources/" || true
            else
              echo "Warning: No matching directory found for $ig_name (expanded resources)"
            fi
          done

      # Show unstaged changes before staging (helpful debugging output)
      - name: Show unstaged changes (before git add)
        shell: bash
        run: |
          echo "=== git status --porcelain ==="
          git status --porcelain || true
          echo "=== git diff --name-only ==="
          git diff --name-only || true

      # Commit all SUSHI-generated ImplementationGuides and expanded resources (if any changes)
      - name: Commit All SUSHI-generated ImplementationGuides and Expanded Resources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          echo "=== Files before staging ==="
          ls -la publisher-guides/*/fsh-generated 2>/dev/null || echo "No fsh-generated directories"
          ls -la publisher-guides/*/input/resources 2>/dev/null || echo "No input/resources directories"
          
          # Stage per-IG fsh-generated outputs and expanded resources
          echo "=== Staging publisher-guides/*/fsh-generated ==="
          git add publisher-guides/*/fsh-generated || true
          
          echo "=== Staging publisher-guides/*/input/resources ==="
          git add publisher-guides/*/input/resources || true
          
          echo "=== Staged changes ==="
          git diff --name-only --cached || true
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            echo "=== Committing changes ==="
            git commit -m "chore: update SUSHI-generated artifacts and expanded resources for all IGs [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "=== Commit and push completed ==="
          fi

      # Download all IG URL metadata to create a unified PR comment
      - name: Download IG URL metadata
        uses: actions/download-artifact@v4
        with:
          pattern: ig-url-*
          path: ig-urls
        continue-on-error: true

      # Create or update a single PR comment with all published IG URLs
      - name: Update PR comment with all published IGs
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = process.env.BRANCH_NAME;
            const marker = `<!-- ig-publish-urls-all -->`;
            const fs = require('fs');
            const path = require('path');
            
            // Collect all IG URLs from artifacts
            const igUrls = [];
            const igUrlsDir = 'ig-urls';
            
            try {
              if (fs.existsSync(igUrlsDir)) {
                const artifacts = fs.readdirSync(igUrlsDir);
                for (const artifact of artifacts) {
                  const urlFile = path.join(igUrlsDir, artifact, 'urls.txt');
                  if (fs.existsSync(urlFile)) {
                    const content = fs.readFileSync(urlFile, 'utf8');
                    const lines = content.trim().split('\n');
                    for (const line of lines) {
                      const [igName, url] = line.split('|');
                      if (igName && url) {
                        igUrls.push({ name: igName.trim(), url: url.trim() });
                      }
                    }
                  }
                }
              }
            } catch (error) {
              core.warning(`Failed to read IG URLs: ${error.message}`);
            }
            
            if (igUrls.length === 0) {
              core.info('No IG URLs found - skipping PR comment');
              return;
            }
            
            // Build comment body with all IGs
            let body = `${marker}\n### 🚀 Published Implementation Guides\n\n`;
            body += `Branch: \`${branch}\`\n\n`;
            
            const publishedIGs = igUrls.filter(ig => ig.url !== 'NO_CHANGES');
            const unchangedIGs = igUrls.filter(ig => ig.url === 'NO_CHANGES');
            
            if (publishedIGs.length > 0) {
              body += '#### ✅ Published IGs:\n\n';
              for (const ig of publishedIGs) {
                body += `- **${ig.name}**: [View Published IG](${ig.url})\n`;
              }
            }
            
            if (unchangedIGs.length > 0) {
              body += '\n#### ℹ️ Skipped (no changes in input/):\n\n';
              for (const ig of unchangedIGs) {
                body += `- **${ig.name}**: No changes detected - build skipped\n`;
              }
              body += '\n_Note: Use "Force build" option in workflow dispatch to rebuild these IGs._\n';
            }
            
            // Try to find an open PR for this branch
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 100
            });
            const pr = prs.find(p => p.head && p.head.ref === branch);
            
            if (!pr) {
              core.info(`No open PR found for branch ${branch}; skipping PR comment.`);
              return;
            }
            
            // List existing comments on that PR
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number, per_page: 100
            });
            
            // Find and delete existing marker comment(s)
            const existingComments = comments.filter(c => typeof c.body === 'string' && c.body.includes(marker));
            
            for (const existing of existingComments) {
              await github.rest.issues.deleteComment({
                owner, repo, comment_id: existing.id
              });
              core.info(`Deleted old PR comment #${existing.id} on PR #${pr.number}`);
            }
            
            // Create new comment
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number, body
            });
            core.info(`Created new PR comment with ${publishedIGs.length} published and ${unchangedIGs.length} skipped IG(s) on PR #${pr.number}`);

