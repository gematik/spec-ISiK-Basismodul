name: Build and Publish IG

# Workflow logic lives in scripts/ig-publisher/README.md and scripts/ig-publisher/*.sh.
# IMPORTANT — Matrix build
# The Implementation Guides (IGs) to be built are configured further down
# in the `strategy.matrix.include` section. For each IG, provide these fields:
#   - ig_name:   A unique identifier / display name (e.g. Organspendeerkennung)
#   - ig_dir:    Directory under `publisher-guides` (e.g. publisher-guides/Organspendeerkennung)
#   - capability_statement_urls: A YAML list with one or more CapabilityStatement URLs
#   - import_cps_filter: Optional filter for import expectation level: SHALL, SHOULD, or MAY.
#     Includes all higher expectations (e.g. MAY -> SHALL + SHOULD + MAY).
#
# Example (add to the matrix below):
#   - ig_name: My-IG
#     ig_dir: publisher-guides/My-IG
#     capability_statement_urls:
#       - https://example.com/CapabilityStatement/Server
#       - https://example.com/CapabilityStatement/Client
#     import_cps_filter: SHOULD
#
# Note: The matrix controls which parallel build jobs are created. Edit that
# list to add or remove IGs or to specify multiple CapabilityStatements per IG.

# Controls when the action will run.
on:
  # Run on pull request events (build only; no gh-pages deploy)
  pull_request:

  # Run on pushes to main release branches
  push:
    branches:
      - main-stufe-*

  # Allow manual triggering for production builds or testing
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no input changes detected'
        required: false
        type: boolean
        default: false

# Ensure only one workflow runs per branch at a time
# New runs will cancel in-progress runs for the same branch
concurrency:
  group: ig-publisher-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:

  # Shared preparation step: Run SUSHI once for all IGs
  prepare:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gefyra/ig-publisher-with-snapshot-support:latest
    env:
      SUSHI_INPUT_DIR: Resources

    steps:
      # Fetch the repository contents for the build container
      - name: Checkout
        uses: actions/checkout@v6

      # Download IG dependencies into the FHIR package cache
      - name: Download Dependencies
        run: |
          fhir-pkg-tool --sushi-deps-file ${{ env.SUSHI_INPUT_DIR }}/sushi-config.yaml
          echo "=== FHIR Package Cache Contents ==="
          ls -la /github/home/.fhir/packages/ | head -20
          echo "==================================="

      # Convert shared FSH inputs into FHIR resources once per workflow
      - name: Run SUSHI
        run: |
          sushi ${{ env.SUSHI_INPUT_DIR }}

      # Share the generated FSH output with parallel IG build jobs
      - name: Upload FSH Generated Resources
        uses: actions/upload-artifact@v6
        with:
          name: fsh-generated
          path: ${{ env.SUSHI_INPUT_DIR }}/fsh-generated
          retention-days: 1

      # Share the FHIR package cache with parallel IG build jobs
      - name: Upload FHIR Package Cache
        uses: actions/upload-artifact@v6
        with:
          name: fhir-packages
          path: /github/home/.fhir/packages
          retention-days: 1

  # ============================================
  # Build each IG in parallel
  # ⚙️ IG Configuration: Add or modify IGs in the matrix below
  # ============================================
  build:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gefyra/ig-publisher-with-snapshot-support:latest
    strategy:
      matrix:
        include: &ig_matrix
          # ig_name: Name of the IG (used for artifact names and publishing)
          # ig_dir: Directory of the IG within publisher-guides
          # capability_statement_urls: List of CapabilityStatement URLs to expand (YAML list)
          # import_cps_filter: Optional filter for import expectation level (SHALL, SHOULD, MAY).
          # Includes all higher expectations (e.g. MAY -> SHALL + SHOULD + MAY).
          #   - For a single URL:
          #       capability_statement_urls:
          #         - https://example.com/CapabilityStatement/Server
          #   - For multiple URLs:
          #       capability_statement_urls:
          #         - https://example.com/CS1
          #         - https://example.com/CS2
          #         - https://example.com/CS3

          - ig_name: ISiK-AMTS
            ig_dir: publisher-guides/AMTS
            capability_statement_urls:
              - https://gematik.de/fhir/isik/CapabilityStatement/ISiKCapabilityStatementAMTSAkteur


          #- ig_name: ISiK-Basis
          #  ig_dir: publisher-guides/Basis
          #  capability_statement_urls:
          #    - https://gematik.de/fhir/isik/CapabilityStatement/ISiKCapabilityStatementBasisServerAkteur

          - ig_name: ISiK-Vitalparameter
            ig_dir: publisher-guides/Vitalparameter
            capability_statement_urls:
              - https://gematik.de/fhir/isik/CapabilityStatement/ISiKCapabilityStatementVitalSignStandardSourceAkteur


          # - ig_name: ICU
          #   ig_dir: publisher-guides/ICU
          #   capability_statement_urls:
          #     - https://gematik.de/fhir/isik/CapabilityStatement/ISiKCapabilityStatementVitalSignICUSourceExtendedAkteur
          #     - https://gematik.de/fhir/isik/CapabilityStatement/ISiKCapabilityStatementVitalSignICUSourceMinimalAkteur
          #     - https://gematik.de/fhir/isik/CapabilityStatement/ISiKCapabilityStatementBasisServerAkteur

          - ig_name: ISiK-Subscriptions
            ig_dir: publisher-guides/Subscription
            capability_statement_urls:
              - https://gematik.de/fhir/isik/CapabilityStatement/ISiKCapabilityStatementSubscriptionServerAkteur

          - ig_name: ISiK-Terminplanung
            ig_dir: publisher-guides/Terminplanung
            capability_statement_urls:
              - https://gematik.de/fhir/isik/CapabilityStatement/ISiKCapabilityStatementTerminRepositoryAkteur
          # Add more IGs here:
          # - ig_name: Basis-IG
          #   ig_dir: publisher-guides/Basis-IG
          #   capability_statement_urls:
          #     - https://gematik.de/fhir/isik/CapabilityStatement/ISiKCapabilityStatementBasisServerAkteur
          #     - https://gematik.de/fhir/isik/CapabilityStatement/Server
          #     - https://gematik.de/fhir/isik/CapabilityStatement/Client
          #   import_cps_filter: SHOULD

          - ig_name: ISiK-Connect
            ig_dir: publisher-guides/Connect
          #  capability_statement_urls:
          #    - https://gematik.de/fhir/isik/CapabilityStatement/ISiKCapabilityStatementBasisServerAkteur
          # Add more IGs here:
          # - ig_name: Basis-IG
          #   ig_dir: publisher-guides/Basis-IG
          #   capability_statement_urls:
          #     - https://gematik.de/fhir/isik/CapabilityStatement/Server
          #     - https://gematik.de/fhir/isik/CapabilityStatement/Client
          #   import_cps_filter: SHOULD
    env:
      SUSHI_INPUT_DIR: Resources
      IG_PUBLISHER_DIR: ${{ matrix.ig_dir }}
      EXPANDED_RESOURCES_DIR: expanded-resources/${{ matrix.ig_name }}

    steps:
      # Fetch the repository contents for the build container
      - name: Checkout
        uses: actions/checkout@v6

      # Pull the shared FHIR package cache from the prepare job
      - name: Download FHIR Package Cache
        uses: actions/download-artifact@v7
        with:
          name: fhir-packages
          path: /github/home/.fhir/packages

      # Mirror the cache to the IG Publisher default location
      - name: Setup Package Cache for IG Publisher
        run: |
          echo "=== Copying packages to /root/.fhir/packages ==="
          mkdir -p /root/.fhir/packages
          cp -r /github/home/.fhir/packages/* /root/.fhir/packages/
          echo "=== Package cache ready ==="
          ls -la /root/.fhir/packages/ | head -20
          echo "==============================="

      # Pull the shared FSH conversion output from the prepare job
      - name: Download FSH Generated Resources
        uses: actions/download-artifact@v7
        with:
          name: fsh-generated
          path: ${{ env.SUSHI_INPUT_DIR }}/fsh-generated

      # Expand capability statements into concrete resources for the IG
      - name: Expand CapabilityStatement
        uses: Gefyra/capabilityStatement-expander@v0
        if: ${{ toJSON(matrix.capability_statement_urls) != 'null' && toJSON(matrix.capability_statement_urls) != '[]' }}
        with:
          input_directory: ${{ env.SUSHI_INPUT_DIR }}/fsh-generated
          output_directory: ${{ env.EXPANDED_RESOURCES_DIR }}
          capability_statement_url: ${{ toJSON(matrix.capability_statement_urls) }}
          expectation_filter: ${{ matrix.import_cps_filter }}

      # Copy expanded resources into the IG input tree used by igpublisher
      - name: Apply expanded resources to IG input
        if: ${{ toJSON(matrix.capability_statement_urls) != 'null' && toJSON(matrix.capability_statement_urls) != '[]' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "${EXPANDED_RESOURCES_DIR}" ]; then
            echo "Expanded resources directory not found: ${EXPANDED_RESOURCES_DIR}"
            exit 1
          fi
          mkdir -p "${IG_PUBLISHER_DIR}/input/resources"
          find "${IG_PUBLISHER_DIR}/input/resources" -mindepth 1 -delete
          cp -a "${EXPANDED_RESOURCES_DIR}/." "${IG_PUBLISHER_DIR}/input/resources/"

      # Copy shared static files defined in scripts/common-files/config.json
      - name: Copy common files from config.json
        shell: bash
        env:
          IG_NAME: ${{ matrix.ig_name }}
        run: bash scripts/common-files/copy-config-files.sh

      # Generate IG-specific ImplementationGuide and menu content
      - name: Run SUSHI (IG local)
        run: |
          sushi ${{ env.IG_PUBLISHER_DIR }}

      # Tag the SUSHI output with its IG directory for later artifact copy
      - name: Write IG dir metadata (SUSHI)
        shell: bash
        run: |
          echo "${IG_PUBLISHER_DIR}" > "${IG_PUBLISHER_DIR}/fsh-generated/ig-dir.txt"

      # Upload per-IG SUSHI output so it can be committed later
      - name: Upload SUSHI-generated ImplementationGuide
        uses: actions/upload-artifact@v6
        with:
          name: sushi-generated-ig-${{ matrix.ig_name }}
          # upload the per-IG fsh-generated directory so the commit job can persist SUSHI outputs as-is
          path: ${{ env.IG_PUBLISHER_DIR }}/fsh-generated
          retention-days: 1

      # Detect whether the IG needs rebuilding based on input changes
      - name: Check for input changes
        id: check_changes
        shell: bash
        env:
          FORCE_BUILD: ${{ (github.event_name == 'push' && startsWith(github.ref_name, 'main-stufe-')) || (github.event.inputs.force_build == 'true') }}
          IG_NAME: ${{ matrix.ig_name }}
        run: bash scripts/ig-publisher/check-changes.sh

      # Run the IG Publisher if changes warrant a rebuild
      - name: Build IG
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          igpublisher -ig ${{ env.IG_PUBLISHER_DIR }}/ig.ini

      # Create a marker so downstream jobs know a build executed
      - name: Mark Build Ran
        if: steps.check_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          mkdir -p build-markers
          echo "${{ matrix.ig_name }}" > "build-markers/${{ matrix.ig_name }}.txt"

      # Upload build markers for the publish gate decision
      - name: Upload Build Marker
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: build-ran-${{ matrix.ig_name }}
          path: build-markers/${{ matrix.ig_name }}.txt
          retention-days: 1

      # Tag expanded resources with their IG directory for later copy
      - name: Write IG dir metadata (expanded resources)
        shell: bash
        run: |
          mkdir -p "${IG_PUBLISHER_DIR}/input/resources"
          echo "${IG_PUBLISHER_DIR}" > "${IG_PUBLISHER_DIR}/input/resources/ig-dir.txt"

      # Upload expanded resources so they can be committed later
      - name: Upload Expanded Resources
        uses: actions/upload-artifact@v6
        with:
          name: expanded-resources-${{ matrix.ig_name }}
          path: ${{ env.IG_PUBLISHER_DIR }}/input/resources
          retention-days: 1
          if-no-files-found: warn

      # Tag input includes with their IG directory for later copy
      - name: Write IG dir metadata (input includes)
        shell: bash
        run: |
          if [ -d "${IG_PUBLISHER_DIR}/input/includes" ]; then
            echo "${IG_PUBLISHER_DIR}" > "${IG_PUBLISHER_DIR}/input/includes/ig-dir.txt"
          fi

      # Upload input includes so they can be committed later
      - name: Upload Input Includes
        uses: actions/upload-artifact@v6
        with:
          name: input-includes-${{ matrix.ig_name }}
          path: ${{ env.IG_PUBLISHER_DIR }}/input/includes
          retention-days: 1
          if-no-files-found: warn

      # Tag input page content with its IG directory for later copy
      - name: Write IG dir metadata (input pagecontent)
        shell: bash
        run: |
          if [ -d "${IG_PUBLISHER_DIR}/input/pagecontent" ]; then
            echo "${IG_PUBLISHER_DIR}" > "${IG_PUBLISHER_DIR}/input/pagecontent/ig-dir.txt"
          fi

      # Upload input page content so it can be committed later
      - name: Upload Input Pagecontent
        uses: actions/upload-artifact@v6
        with:
          name: input-pagecontent-${{ matrix.ig_name }}
          path: ${{ env.IG_PUBLISHER_DIR }}/input/pagecontent
          retention-days: 1
          if-no-files-found: warn

      # Store branch info used by gh-pages cleanup logic
      - name: Record branch metadata for Pages cleanup
        if: steps.check_changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
        run: |
          set -eu
          branch_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "${branch_name}" > "${{ env.IG_PUBLISHER_DIR }}/output/.branch-name"

      # Upload the generated IG site output for publishing
      - name: Upload Build Results
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: fhir-ig-${{ matrix.ig_name }}
          path: |
            ${{ env.IG_PUBLISHER_DIR }}/output


  # Commit all expanded resources in one go
  commit:
    needs: [build, publish_gate]
    runs-on: ubuntu-latest
    if: needs.publish_gate.outputs.should_publish == 'true'

    steps:
      # Check out the source branch so commits land in the right place
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Download SUSHI-generated IGs from all build jobs
      - name: Download SUSHI-generated ImplementationGuides
        uses: actions/download-artifact@v7
        with:
          pattern: sushi-generated-ig-*
          path: artifacts/sushi-generated-ig

      # Download expanded resources from all build jobs
      - name: Download Expanded Resources
        uses: actions/download-artifact@v7
        with:
          pattern: expanded-resources-*
          path: artifacts/expanded-resources

      # Download IG input includes from all build jobs
      - name: Download Input Includes
        uses: actions/download-artifact@v7
        with:
          pattern: input-includes-*
          path: artifacts/input-includes

      # Download IG input page content from all build jobs
      - name: Download Input Pagecontent
        uses: actions/download-artifact@v7
        with:
          pattern: input-pagecontent-*
          path: artifacts/input-pagecontent

      # Copy artifacts into their per-IG directories in the repo
      - name: Copy SUSHI-generated IGs and Expanded Resources
        shell: bash
        run: bash scripts/ig-publisher/copy-artifacts.sh

      # Commit updated generated artifacts back to the branch
      - name: Commit All SUSHI-generated ImplementationGuides and Expanded Resources
        shell: bash
        run: bash scripts/ig-publisher/commit-artifacts.sh


  publish_gate:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      should_publish: ${{ steps.publish_check.outputs.should_publish }}
    steps:
      # Collect build markers to determine whether any IG was rebuilt
      - name: Download build markers
        id: download_markers
        uses: actions/download-artifact@v7
        with:
          pattern: build-ran-*
          path: build-markers
          merge-multiple: true
        continue-on-error: true

      # Decide whether publishing should run based on build markers
      - name: Decide whether to publish
        id: publish_check
        shell: bash
        run: |
          if [ -d build-markers ] && [ -n "$(ls -A build-markers 2>/dev/null)" ]; then
            echo "Build markers found:"
            ls -1 build-markers | sed 's/\.txt$//' || true
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Publish gate: yes (at least one IG build ran)"
          else
            echo "No build markers found."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Publish gate: no (no IG build ran)"
          fi

  publish:
    needs: [build, publish_gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref_name, 'main-stufe-') && needs.publish_gate.outputs.should_publish == 'true'
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      # Fetch the repository contents for the publish step
      - name: Checkout
        uses: actions/checkout@v6

      # Download all IG build outputs produced by the build job
      - name: Download Build Results
        uses: actions/download-artifact@v7
        with:
          pattern: fhir-ig-*
          path: publish-output
        continue-on-error: true

      # Publish the build outputs to the gh-pages branch
      - name: Publish branch output to GitHub Pages
        shell: bash
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          PUBLISH_OUTPUT_DIR="publish-output" bash scripts/ig-publisher/publish-branch.sh
