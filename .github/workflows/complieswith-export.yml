name: CompliesWith Export

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

env:
  COMPLIESWITH_DEPENDENCIES: |
    hl7.fhir.eu.eps#current
    hl7.fhir.eu.hdr#current
    hl7.fhir.eu.base#current
    hl7.fhir.eu.laboratory#current
    de.medizininformatikinitiative.kerndatensatz.prozedur#2025.0.1
    kbv.basis#1.8.0
    de.gevko.emdaf#1.3.0

jobs:
  export_validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'stufe-6/all/feature/CompliesWith-Branch' }}

      - name: Add CompliesWith dependencies
        env:
          COMPLIESWITH_DEPENDENCIES: ${{ env.COMPLIESWITH_DEPENDENCIES }}
        run: node scripts/complieswith/add-dependencies.js

      - name: Uncomment CompliesWith inserts in FSH files
        run: node scripts/complieswith/uncomment-inserts.js

      - name: Run SUSHI
        run: npx fsh-sushi Resources/ -s

      - name: Filter validation targets
        run: node scripts/complieswith/filter-validation-targets.js

      - name: Firely.Terminal (GitHub Actions)
        id: firely_terminal
        continue-on-error: true
        uses: FirelyTeam/firely-terminal-pipeline@v0.8.4
        with:
          PATH_TO_CONFORMANCE_RESOURCES: Resources/fsh-generated/complieswith-validation/
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: true
          JAVA_VALIDATION_OPTIONS: >
            -allow-example-urls true
            -output validation.json
            -html-output validation.html
            -show-message-ids
            -language de
            -jurisdiction de
            -display-issues-are-warnings
            -advisor-file validator/advisor.json
            -resolution-context file:Resources/fsh-generated/resources/
          SIMPLIFIER_USERNAME: ${{ secrets.SIMPLIFIER_USERNAME }}
          SIMPLIFIER_PASSWORD: ${{ secrets.SIMPLIFIER_PASSWORD }}
          SUSHI_ENABLED: false
          TERMINOLOGY_SERVICE_BFARM_ENABLED: true
          CLOSE_SLICING_FOR_VALIDATION: true
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_JAVA VALIDATION_CONFORMANCE_DOTNET

      - name: Check validation outputs
        id: validation_outputs
        if: always()
        shell: bash
        run: |
          if [ -f validation.json ]; then
            echo "has_validation_json=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_validation_json=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload validation artifacts
        if: always() && steps.validation_outputs.outputs.has_validation_json == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: complieswith-export-validation-results
          path: |
            validation.json
            validation.html
          retention-days: 1
          if-no-files-found: warn

      - name: Extract validation filters from main workflow
        id: validation_filters
        if: always()
        shell: bash
        run: node scripts/complieswith/extract-validation-filters.js >> "$GITHUB_OUTPUT"

      - name: Comment validation results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          VALIDATION_FILTERS: ${{ steps.validation_filters.outputs.filters }}
        with:
          github-token: ${{ github.token }}
          script: |
            const run = require('./scripts/complieswith/update-pr-comment.js');
            await run({ github, context, core });
