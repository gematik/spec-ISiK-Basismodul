name: CompliesWith Export

on:
  push:
    branches:
      - stufe-6/all/feature/CompliesWith-Branch
  workflow_dispatch:
  # pull_request_target:
  #   types:
  #     - closed
  #   branches:
  #     - main-stufe-6

permissions:
  actions: write
  contents: write

env:
  COMPLIESWITH_DEPENDENCIES: |
    hl7.fhir.eu.eps#current
    hl7.fhir.eu.hdr#current
    hl7.fhir.eu.base#current
    hl7.fhir.eu.laboratory#current
    de.medizininformatikinitiative.kerndatensatz.prozedur#2025.0.1
    kbv.basis#1.8.0
    de.gevko.emdaf#1.3.0

jobs:
  # sync_branch:
  #   if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
  #   runs-on: ubuntu-latest
  #
  #   steps:
  #     - name: Checkout export branch
  #       uses: actions/checkout@v6
  #       with:
  #         ref: stufe-6/all/feature/CompliesWith-Branch
  #         fetch-depth: 0
  #         token: ${{ secrets.WORKFLOW_PERMISSION_GITHUB }}
  #
  #     - name: Reset export branch to main-stufe-6
  #       run: |
  #         git fetch origin main-stufe-6 stufe-6/all/feature/CompliesWith-Branch
  #         git reset --hard origin/main-stufe-6
  #         git push --force-with-lease origin HEAD:stufe-6/all/feature/CompliesWith-Branch
  #
  export_validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: stufe-6/all/feature/CompliesWith-Branch

      - name: Add CompliesWith dependencies
        env:
          COMPLIESWITH_DEPENDENCIES: ${{ env.COMPLIESWITH_DEPENDENCIES }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const config = (process.env.COMPLIESWITH_DEPENDENCIES || '')
            .split('\n')
            .map(line => line.trim())
            .filter(line => line && !line.startsWith('#'));

          if (config.length === 0) {
            console.log('No CompliesWith dependencies configured.');
            process.exit(0);
          }

          const entries = config.map(line => {
            const idx = line.lastIndexOf('#');
            if (idx <= 0 || idx === line.length - 1) {
              throw new Error(`Invalid dependency entry "${line}". Expected Package#version.`);
            }
            return [line.slice(0, idx), line.slice(idx + 1)];
          });

          const packageJsonPath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));
          packageJson.dependencies ??= {};
          packageJson.devDependencies ??= {};
          for (const [pkg, version] of entries) {
            delete packageJson.dependencies[pkg];
            packageJson.devDependencies[pkg] = version;
          }
          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);

          const sushiConfigPath = 'Resources/sushi-config.yaml';
          const sushiConfigRaw = fs.readFileSync(sushiConfigPath, 'utf8').replace(/\r\n/g, '\n');
          const dependenciesMatch = sushiConfigRaw.match(/(^dependencies:\n)((?:^[ \t]+.+\n?)*)/m);
          if (!dependenciesMatch) {
            throw new Error('Could not find dependencies section in Resources/sushi-config.yaml.');
          }

          const existing = new Map();
          for (const line of dependenciesMatch[2].split('\n')) {
            const match = line.match(/^[ \t]+([^:#]+):[ \t]*(.+)$/);
            if (match) {
              existing.set(match[1].trim(), match[2].trim());
            }
          }
          for (const [pkg, version] of entries) {
            existing.set(pkg, version);
          }

          const rebuiltDependencies = Array.from(existing.entries())
            .map(([pkg, version]) => `  ${pkg}: ${version}`)
            .join('\n');

          const updatedSushiConfig =
            sushiConfigRaw.slice(0, dependenciesMatch.index) +
            dependenciesMatch[1] +
            rebuiltDependencies +
            '\n' +
            sushiConfigRaw.slice(dependenciesMatch.index + dependenciesMatch[0].length).replace(/^\n*/, '');

          fs.writeFileSync(sushiConfigPath, updatedSushiConfig.replace(/\n/g, '\r\n'));
          NODE

      - name: Comment CompliesWith inserts in FSH files
        run: |
          find Resources -name '*.fsh' -print0 | while IFS= read -r -d '' file; do
            sed -Ei 's#^([[:space:]]*)\* insert CompliesWith#\1// * insert CompliesWith#' "$file"
          done

      - name: Firely.Terminal (GitHub Actions)
        uses: FirelyTeam/firely-terminal-pipeline@v0.8.4
        with:
          PATH_TO_CONFORMANCE_RESOURCES: Resources/fsh-generated/resources/
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: true
          JAVA_VALIDATION_OPTIONS: >
            -allow-example-urls true
            -output validation.json
            -html-output validation.html
            -show-message-ids
            -language de
            -jurisdiction de
            -display-issues-are-warnings
            -advisor-file validator/advisor.json
            -resolution-context file:Resources/fsh-generated/resources/
          SIMPLIFIER_USERNAME: ${{ secrets.SIMPLIFIER_USERNAME }}
          SIMPLIFIER_PASSWORD: ${{ secrets.SIMPLIFIER_PASSWORD }}
          SUSHI_ENABLED: true
          TERMINOLOGY_SERVICE_BFARM_ENABLED: true
          CLOSE_SLICING_FOR_VALIDATION: true
          SUSHI_OPTIONS: Resources/
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_JAVA VALIDATION_CONFORMANCE_DOTNET

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: complieswith-export-validation-results
          path: |
            validation.json
            validation.html
          retention-days: 1

      - name: Convert Validation Report
        uses: patrick-werner/validation-outcome-markdown-renderer@v1
        with:
          bundle-file: validation.json
          include: errors,warnings
          filters: |
            # Struktur: fileName|messageId|detailsWildcard|location
            # Bundle contains more than specified as slices, which is ok
            Bundle-BundleExampleIntensivstation.json|Validation_VAL_Profile_NotSlice||Bundle.entry[3]
            Bundle-BundleExampleIntensivstation.json|Validation_VAL_Profile_NotSlice||Bundle.entry[4]
            Bundle-BundleExampleIntensivstation.json|Validation_VAL_Profile_NotSlice||Bundle.entry[5]
            # examples contain sdc extensions which creates an error as this extension is not defined in ISiK
            Patient-IsikPatientTemplate.json|Validation_VAL_Profile_NotSlice||Patient.gender.extension[0]
            Patient-IsikPatientTemplate.json|Validation_VAL_Profile_NotSlice||Patient.birthDate.extension[0]
            Questionnaire-DemoTemplatebasedExtractionQuestionnaire.json|Validation_VAL_Profile_NotSlice||Questionnaire.contained[0]/*Patient/IsikPatientTemplate*/.gender.extension[0]
            Questionnaire-DemoTemplatebasedExtractionQuestionnaire.json|Validation_VAL_Profile_NotSlice||Questionnaire.contained[0]/*Patient/IsikPatientTemplate*/.birthDate.extension[0]
