name: CompliesWith Export

on:
  pull_request:
    branches:
      - '**'
  # Referenzlauf auf den Hauptbranches: liefert das Baseline-Artefakt für den
  # Vergleich im PR-Kommentar (PTDATA-2430 / PTDATA-2431).
  push:
    branches:
      - 'main-stufe-*'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

env:
  # Validator-JAR (privater Fork mit Advisor-Filterung, siehe README). Die URL wird mit dem
  # Ergebnis persistiert, damit ein Wechsel im Vergleich sichtbar wird.
  VALIDATOR_URL: https://github.com/jschoen-gefyra/org.hl7.fhir.core/releases/download/v6.9.8-snapshot-build/org.hl7.fhir.validation.cli-6.9.8-SNAPSHOT.jar
  #VALIDATOR_URL: https://github.com/hapifhir/org.hl7.fhir.core/releases/download/6.9.7/validator_cli.jar
  COMPLIESWITH_DEPENDENCIES: |
    hl7.fhir.eu.eps#current
    hl7.fhir.eu.hdr#current
    hl7.fhir.eu.base#current
    hl7.fhir.eu.laboratory#current
    hl7.fhir.eu.mpd#1.0.0
    de.medizininformatikinitiative.kerndatensatz.base#2026.0.0
    kbv.basis#1.8.0
    de.gevko.emdaf#1.3.0

jobs:
  export_validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Test CompliesWith scripts
        run: node --test scripts/complieswith/parse-validator-log.test.js scripts/complieswith/compare-results.test.js

      - name: Add CompliesWith dependencies
        env:
          COMPLIESWITH_DEPENDENCIES: ${{ env.COMPLIESWITH_DEPENDENCIES }}
        run: node scripts/complieswith/add-dependencies.js

      - name: Uncomment CompliesWith inserts in FSH files
        run: node scripts/complieswith/uncomment-inserts.js

      - name: Run SUSHI
        uses: ./.github/actions/run-sushi-with-zts
        with:
          dir: Resources
          accepted-download-conditions: ${{ vars.ZTS_ACCEPTED_DOWNLOAD_CONDITIONS }}
          # this job has no global "sushi" binary, unlike the IG Publisher container image
          sushi-command: npx fsh-sushi . -s

      - name: Filter validation targets
        run: node scripts/complieswith/filter-validation-targets.js

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Java validator
        run: curl -L "$VALIDATOR_URL" -o validator_cli.jar

      - name: Run Java validator for CompliesWith
        id: java_validator
        continue-on-error: true
        env:
          VALIDATOR_JAR: validator_cli.jar
          VALIDATION_DIR: Resources/fsh-generated/complieswith-validation
          RESOLUTION_CONTEXT_DIR: Resources/fsh-generated/resources
          ADVISOR_FILE: validator/advisor.json
          RAW_LOG_PATH: validation-raw.log
          DETAILS_JSON_PATH: validation-details.json
        run: node scripts/complieswith/run-java-validator.js

      - name: Check validation outputs
        id: validation_outputs
        if: always()
        shell: bash
        run: |
          if [ -f validation-details.json ]; then
            echo "has_validation_details=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_validation_details=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect resolved dependency versions
        if: always()
        env:
          COMPLIESWITH_DEPENDENCIES: ${{ env.COMPLIESWITH_DEPENDENCIES }}
        run: node scripts/complieswith/collect-dependency-versions.js

      # Baseline: jüngster push-Lauf dieses Workflows auf dem Base-Branch des PRs mit Artefakt.
      - name: Find baseline run on base branch
        id: baseline
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          WORKFLOW_FILE: complieswith-export.yml
          ARTIFACT_NAME: complieswith-export-validation-results
        with:
          github-token: ${{ github.token }}
          script: |
            const run = require('./scripts/complieswith/find-baseline-run.js');
            await run({ github, context, core });

      - name: Download baseline artifact
        if: always() && steps.baseline.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          name: complieswith-export-validation-results
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: baseline

      # Report: Job Summary immer, PR-Kommentar nur bei pull_request. Vergleicht mit der Baseline
      # und mit dem vorigen Lauf desselben PRs und setzt die Outputs für den Fail-Step.
      - name: Report validation results
        id: report
        if: always()
        uses: actions/github-script@v9
        env:
          VALIDATOR_OUTCOME: ${{ steps.java_validator.outcome }}
          VALIDATOR_URL: ${{ env.VALIDATOR_URL }}
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASELINE_FOUND: ${{ steps.baseline.outputs.found || 'false' }}
          BASELINE_RUN_ID: ${{ steps.baseline.outputs.run_id || '' }}
          BASELINE_RUN_URL: ${{ steps.baseline.outputs.run_url || '' }}
          BASELINE_HEAD_SHA: ${{ steps.baseline.outputs.head_sha || '' }}
          BASELINE_CREATED_AT: ${{ steps.baseline.outputs.created_at || '' }}
          BASELINE_DIR: baseline
        with:
          github-token: ${{ github.token }}
          script: |
            const run = require('./scripts/complieswith/update-pr-comment.js');
            await run({ github, context, core });

      - name: Upload validation artifacts
        if: always() && steps.validation_outputs.outputs.has_validation_details == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: complieswith-export-validation-results
          path: |
            validation-details.json
            validation-raw.log
            complieswith-result.json
            dependency-versions.json
          retention-days: 90
          if-no-files-found: warn

      # Der CompliesWith-Job ist ein Report, kein Gate (PTDATA-2396/2431): Der Job wird nur rot,
      # wenn gegenüber der Basis neue CompliesWith-Fehler hinzugekommen sind, oder bei
      # Infrastrukturfehlern. Ohne Baseline wird der Job wegen CompliesWith-Fehlern nicht rot.
      - name: Fail job on new CompliesWith errors or infrastructure errors
        if: always()
        shell: bash
        env:
          INFRA_ERROR: ${{ steps.report.outputs.infra_error }}
          HAS_BASELINE: ${{ steps.report.outputs.has_baseline }}
          NEW_ERRORS: ${{ steps.report.outputs.new_errors_vs_base }}
          ERROR_COUNT: ${{ steps.report.outputs.error_count }}
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
        run: |
          if [ -z "$INFRA_ERROR" ]; then
            echo "::error title=CompliesWith::Der Report-Step hat keine Outputs geliefert. Bitte Log des Steps 'Report validation results' prüfen."
            exit 1
          fi
          if [ "$INFRA_ERROR" = "true" ]; then
            echo "::error title=CompliesWith::Validator-Lauf fehlgeschlagen, ohne dass CompliesWith-Fehler ausgewertet werden konnten (Infrastrukturfehler). Bitte Log des Steps 'Run Java validator for CompliesWith' prüfen."
            exit 1
          fi
          if [ "${NEW_ERRORS:-0}" -gt 0 ]; then
            echo "::error title=CompliesWith::${NEW_ERRORS} neue CompliesWith-Fehler gegenüber ${BASE_REF} (gesamt ${ERROR_COUNT}). Details im PR-Kommentar."
            exit 1
          fi
          if [ "$HAS_BASELINE" = "true" ]; then
            echo "::notice title=CompliesWith::${ERROR_COUNT} CompliesWith-Fehler, keine neuen gegenüber ${BASE_REF}. Report, kein Gate."
          else
            echo "::notice title=CompliesWith::${ERROR_COUNT} CompliesWith-Fehler, keine Baseline zum Vergleich. Report, kein Gate."
          fi
