
name: TC version update

# Controls when the action will run. 
on:
    push:
      branches:
        - 'TC-6*'
        - 'TC_6*'
        - 'TC-5*'
        - 'TC_5*'

# The release/versioning logic (release_publish.py incl. the per-Stufe IG exclusion list) is maintained
# centrally in https://github.com/gematik/ISIK-tooling-automation (release_publish/, PTDATA-2345).
# This workflow only passes the repo-specific parameters (regex config). The Stufe and therefore the
# IG exclusion list are derived from the branch name (TC-<stufe>*/TC_<stufe>*).
# To exclude further IGs for a Stufe, edit release_publish/excluded_igs.yaml in the central repo.
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
          - name: checkout repo content
            uses: actions/checkout@v6 # checkout the repository content

          - name: update release version and date
            # TODO(PTDATA-2345): pin to the commit SHA of the merged tooling PR instead of the feature branch
            uses: gematik/ISIK-tooling-automation/release_publish@feature/release-publish-action-PTDATA-2345
            with:
              config: scripts/config.yaml

          - name: Add & Commit
            uses: EndBug/add-and-commit@v9
            with:
              committer_name: GitHub Actions Bot
              committer_email: ActionBot@github.com
              message: auto-generated file update of TC version by GitHub Actions (CI FSH to FHIR Validation)
